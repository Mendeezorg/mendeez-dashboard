<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mendeez Retail Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--s:#f8f8f8;--s2:#f0f0f0;
  --b:#e0e0e0;--b2:#d0d0d0;
  --t:#111;--m:#666;--m2:#999;
  --a:#111;
  --g:#1a9e5c;--gd:#e8f8f0;
  --r:#cc3333;--rd:#fdf0f0;
  --bl:#2563eb;--bld:#eff6ff;
  --or:#d97706;--ord:#fff7ed;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--t);min-height:100vh;font-size:14px}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:#f5f5f5;z-index:9999;display:flex;align-items:center;justify-content:center}
.lbox{background:#fff;border:1px solid var(--b);border-radius:12px;padding:44px 48px;width:100%;max-width:400px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.llogo{font-size:26px;font-weight:800;color:#111;letter-spacing:.1em;margin-bottom:4px}
.lsub{font-size:10px;color:var(--m);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:32px}
.linput{width:100%;background:var(--s);border:1px solid var(--b);color:var(--t);padding:11px 14px;border-radius:7px;font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s;margin-bottom:10px}
.linput:focus{border-color:#111}
.linput::placeholder{color:var(--m2)}
.lbtn{width:100%;background:#111;color:#fff;border:none;padding:12px;border-radius:7px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .15s}
.lbtn:hover{opacity:.85}
.lerr{color:var(--r);font-size:11px;font-family:var(--mono);min-height:18px;margin-bottom:6px}
.lforgot{font-size:11px;color:var(--m);font-family:var(--mono);margin-top:14px;cursor:pointer;text-decoration:underline}

/* TOPBAR */
.topbar{height:52px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.tlogo{font-size:13px;font-weight:800;letter-spacing:.08em;color:#111}
.tlogo span{color:var(--m);font-size:10px;font-weight:400;margin-left:6px;font-family:var(--mono)}
.tright{display:flex;align-items:center;gap:10px}
.tuser{font-size:11px;font-family:var(--mono);color:var(--m)}
.trole{font-size:10px;font-family:var(--mono);color:#fff;background:#111;padding:2px 8px;border-radius:4px}
.tlout{background:none;border:1px solid var(--b);color:var(--m);padding:5px 12px;border-radius:5px;font-size:11px;cursor:pointer;font-family:var(--mono)}
.tlout:hover{border-color:var(--r);color:var(--r)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--b);background:#fff;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-size:11px;font-weight:700;color:var(--m);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase;font-family:var(--mono)}
.tab:hover{color:#111}
.tab.active{color:#111;border-bottom-color:#111}
.tab.asm-tab{color:var(--bl)}
.tab.asm-tab.active{color:var(--bl);border-bottom-color:var(--bl)}

/* PANELS */
.panel{display:none;padding:20px 22px;max-width:1400px}
.panel.active{display:block}

/* CARDS */
.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card-title{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#444;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}

/* SUMMARY CARDS ROW */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.scard{background:#fff;border:1px solid var(--b);border-radius:10px;padding:16px 18px}
.scard-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--m);margin-bottom:8px}
.scard-val{font-size:28px;font-weight:700;font-family:var(--mono)}
.scard-val.red{color:var(--r)}
.scard-val.green{color:var(--g)}
.scard-val.amber{color:var(--or)}
.scard-val.blue{color:var(--bl)}

/* NATURE CARDS */
.nature-section{background:#fff;border:1px solid var(--b);border-radius:10px;padding:18px 20px;margin-bottom:18px}
.nature-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.nat-card{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:14px;cursor:pointer;transition:border-color .15s}
.nat-card:hover{border-color:#111}
.nat-name{font-size:11px;font-weight:600;color:#111;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nat-count{font-size:24px;font-weight:700;font-family:var(--mono);margin-bottom:2px}
.nat-pct{font-size:10px;color:var(--m);font-family:var(--mono)}

/* TARGET CARD */
.tva-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tva-lbl{font-size:10px;color:var(--m);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.tva-val{font-size:22px;font-weight:700;font-family:var(--mono);color:#111}
.tva-val.green{color:var(--g)}
.tva-val.amber{color:var(--or)}
.prog-bg{height:8px;background:var(--s2);border-radius:4px;overflow:hidden;margin:8px 0}
.prog-fill{height:100%;border-radius:4px;transition:width .6s}
.pct-pill{display:inline-flex;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:700;font-family:var(--mono)}

/* COMPLAINT BUTTON AREA */
.cmp-area{background:#fff;border:1px solid var(--b);border-radius:10px;padding:18px 20px}
.cmp-mini-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cmp-mini{background:var(--s);border:1px solid var(--b);border-radius:7px;padding:12px;text-align:center}
.cmp-mini-val{font-size:22px;font-weight:700;font-family:var(--mono);margin-bottom:3px}
.cmp-btn{width:100%;background:var(--rd);border:1px solid var(--r);color:var(--r);padding:10px;border-radius:7px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.cmp-btn:hover{background:var(--r);color:#fff}

/* MAIN 2-COL */
.main2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:900px){.main2{grid-template-columns:1fr}}

/* DATE BAR */
.datebar{display:flex;align-items:center;gap:8px;background:var(--s);border:1px solid var(--b);border-radius:8px;padding:10px 14px;margin-bottom:16px;flex-wrap:wrap}
.dblbl{font-size:10px;color:var(--m);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.dbtn{background:#fff;border:1px solid var(--b);color:var(--m);padding:5px 12px;border-radius:5px;font-size:11px;cursor:pointer;font-family:var(--mono);transition:all .15s}
.dbtn:hover,.dbtn.active{background:#111;border-color:#111;color:#fff}
.dinput{background:#fff;border:1px solid var(--b);color:#111;padding:5px 10px;border-radius:5px;font-family:var(--mono);font-size:11px;outline:none}
.dinput:focus{border-color:#111}
.dapply{background:#111;color:#fff;border:none;padding:5px 14px;border-radius:5px;font-family:var(--sans);font-size:11px;font-weight:700;cursor:pointer}

/* OUTLET HEADER */
.out-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.out-name{font-size:20px;font-weight:800;color:#111}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--s);border:1px solid var(--b);border-radius:20px;padding:4px 12px;font-size:10px;font-family:var(--mono);color:var(--m)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--g);display:inline-block;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

/* ASM GRID */
.asm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
@media(max-width:1100px){.asm-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.asm-grid{grid-template-columns:1fr}}
.acard{background:#fff;border:1px solid var(--b);border-radius:10px;padding:16px 18px;cursor:pointer;transition:all .15s}
.acard:hover{border-color:#111;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.acard-name{font-size:12px;font-weight:700;color:#111;margin-bottom:8px}
.acard-sale{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--or);margin-bottom:2px}
.acard-tgt{font-size:10px;color:var(--m);font-family:var(--mono);margin-bottom:8px}
.acard-bar{height:5px;background:var(--s2);border-radius:3px;overflow:hidden;margin-bottom:8px}
.acard-fill{height:100%;border-radius:3px}
.acard-tags{display:flex;gap:6px}
.atag{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:4px}
.atag.red{background:var(--rd);color:var(--r)}
.atag.green{background:var(--gd);color:var(--g)}

/* TARGET SETTER */
.ts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.ts-grid{grid-template-columns:1fr 1fr}}
.ts-item{background:var(--s);border:1px solid var(--b);border-radius:7px;padding:12px 14px}
.ts-name{font-size:11px;font-weight:600;color:#111;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-input{width:100%;background:#fff;border:1px solid var(--b);color:#111;padding:7px 10px;border-radius:5px;font-family:var(--mono);font-size:12px;outline:none}
.ts-input:focus{border-color:#111}

/* COMPLAINT OVERLAY */
#cmpOverlay{display:none;position:fixed;inset:0;background:#fff;z-index:200;overflow-y:auto}
.cov-wrap{max-width:1200px;margin:0 auto;padding:24px 26px}
.cov-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.cov-back{background:none;border:1px solid var(--b);color:var(--m);padding:7px 16px;border-radius:6px;cursor:pointer;font-family:var(--sans);font-size:12px;transition:all .15s}
.cov-back:hover{border-color:#111;color:#111}
.cov-title{font-size:18px;font-weight:700;color:#111;margin-bottom:2px}
.cov-sub{font-size:11px;color:var(--m);font-family:var(--mono)}

/* FILTERS */
.cov-filters{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cov-fi{background:#fff;border:1px solid var(--b);color:#111;padding:7px 10px;border-radius:6px;font-family:var(--mono);font-size:12px;outline:none;transition:border-color .15s}
.cov-fi:focus{border-color:#111}
.cov-lbl{font-size:11px;color:var(--m);font-family:var(--mono);white-space:nowrap}
.cov-clr{background:none;border:1px solid var(--b);color:var(--m);padding:6px 12px;border-radius:5px;font-size:11px;cursor:pointer}
.cov-clr:hover{border-color:#111;color:#111}

/* SECTION TITLE */
.sec-title{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#111;margin-bottom:12px}

/* INVENTORY */
.inv-table{width:100%;border-collapse:collapse;font-size:12px}
.inv-table th{padding:8px 12px;text-align:left;font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--b);background:var(--s);white-space:nowrap}
.inv-table td{padding:8px 12px;border-bottom:1px solid var(--b);font-family:var(--mono)}
.inv-table tr:hover td{background:var(--s)}
.stk-ok{background:var(--gd);color:var(--g);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.stk-low{background:var(--ord);color:var(--or);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.stk-out{background:var(--rd);color:var(--r);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}

/* SHARED */
.btn{border:none;padding:8px 16px;border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s}
.btn-dark{background:#111;color:#fff}.btn-dark:hover{opacity:.85}
.btn-out{background:none;border:1px solid var(--b);color:#111}.btn-out:hover{background:var(--s)}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-red{background:var(--rd);border:1px solid var(--r);color:var(--r);padding:8px 14px;border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer}
.btn-red:hover{background:var(--r);color:#fff}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.al-blue{background:var(--bld);border:1px solid #bfdbfe;color:var(--bl);border-radius:6px;padding:10px 14px;font-size:12px;display:flex;gap:8px;margin-bottom:12px}
.mnth-badge{background:var(--s);border:1px solid var(--b);border-radius:5px;padding:3px 10px;font-size:10px;font-family:var(--mono);color:var(--m)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="lbox">
    <div class="llogo">MENDEEZ</div>
    <div class="lsub">Retail Operations Dashboard</div>
    <input id="lu" class="linput" type="text" placeholder="Username"
      onkeydown="if(event.key==='Enter')document.getElementById('lp').focus()">
    <div style="position:relative;margin-bottom:10px">
      <input id="lp" class="linput" type="password" placeholder="Password"
        style="margin-bottom:0;padding-right:40px"
        onkeydown="if(event.key==='Enter')doLogin()" oninput="document.getElementById('lerr').textContent=''">
      <button type="button" onclick="togglePwd()" id="eyeBtn"
        style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#999;font-size:16px;padding:0;line-height:1">
        👁
      </button>
    </div>
    <div id="lerr" class="lerr"></div>
    <button class="lbtn" onclick="doLogin()">Sign In</button>
    <div class="lforgot" onclick="alert('To reset your password contact:\nsupport@mendeez.com')">Forgot password?</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="tlogo">MENDEEZ <span>Retail Dashboard</span></div>
    <div class="tright">
      <div class="tuser" id="tUser"></div>
      <div class="trole" id="tRole"></div>
      <a href="/" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:transparent;border:1px solid #1a9e5c;border-radius:6px;color:#1a9e5c;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;font-family:'Syne',sans-serif">🏠 Portal</a>
      <a href="/tasks/" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:#1a9e5c;border:none;border-radius:6px;color:#fff;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;font-family:'Syne',sans-serif">✅ Task Manager</a>
      
      <button class="tlout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="tabs" id="tabBar"></div>
  <div id="panels"></div>
</div>

<!-- COMPLAINT OVERLAY -->
<div id="cmpOverlay">
  <div class="cov-wrap">

    <!-- Header -->
    <div class="cov-hdr">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="cov-back" onclick="closeCmp()">← Back</button>
        <div>
          <div class="cov-title">Complaints</div>
          <div class="cov-sub" id="cmpSub"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="cmpStatus" style="font-size:11px;font-family:var(--mono);color:var(--m)"></span>
        <button class="btn btn-out btn-sm" onclick="refreshCmp()">↻ Refresh</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="cov-filters">
      <!-- Outlet selector — ASM only, shown/hidden by JS -->
      <div id="cmpOutletWrap" style="display:none;align-items:center;gap:8px">
        <span class="cov-lbl">Outlet:</span>
        <select id="cmpOutletSel" class="cov-fi" style="width:190px" onchange="cmpApplyFilters()">
          <option value="">-- Select outlet --</option>
        </select>
      </div>
      <!-- Date range — always shown -->
      <span class="cov-lbl">From:</span>
      <input type="date" id="cmpFrom" class="cov-fi" onchange="cmpApplyFilters()">
      <span class="cov-lbl">To:</span>
      <input type="date" id="cmpTo" class="cov-fi" onchange="cmpApplyFilters()">
      <button class="cov-clr" onclick="cmpClear()">✕ Clear</button>
      <span id="cmpFStatus" style="font-size:11px;font-family:var(--mono);color:var(--m);margin-left:auto"></span>
    </div>

    <!-- Empty state -->
    <div id="cmpEmpty" style="text-align:center;padding:60px;color:var(--m2);font-family:var(--mono)">
      <div style="font-size:36px;margin-bottom:10px">🔍</div>
      <div style="font-weight:600;font-size:13px;margin-bottom:4px">Select filters to view complaints</div>
      <div style="font-size:11px">Choose an outlet or date range above</div>
    </div>

    <!-- Content -->
    <div id="cmpContent" style="display:none">

      <!-- ROW 1: Summary cards -->
      <div class="summary-row" id="cmpSummaryCards"></div>

      <!-- ROW 2: Nature breakdown -->
      <div class="nature-section">
        <div class="sec-title">Complaint Nature Breakdown</div>
        <div class="nature-grid" id="cmpNatureGrid"></div>
      </div>

      <!-- Complaint Log -->
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <div class="sec-title" style="margin:0">Complaint Log</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="cov-lbl">Filter by nature:</span>
            <select id="cmpNatureFilter" class="cov-fi" style="width:200px" onchange="cmpRenderTable()">
              <option value="">All Complaints</option>
            </select>
            <span id="cmpTblCount" style="font-size:11px;font-family:var(--mono);color:var(--m)"></span>
          </div>
        </div>
        <div style="overflow-x:auto;max-height:500px;overflow-y:auto;border:1px solid var(--b);border-radius:6px">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead id="cmpTHead" style="position:sticky;top:0;background:var(--s)"></thead>
            <tbody id="cmpTBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script>

  {u:'dha',      p:'Dha@@2026!',  role:'outlet',  outlet:'DHA Cricket Stadium',        oid:'dha',      name:'DHA Manager'},

  {u:'habbit',   p:'Hbbt@2026!',  role:'outlet',  outlet:'Habbit Markitt',             oid:'habbit',   name:'Habbit Manager'},
  {u:'squareone',p:'Sq1@@2026!',  role:'outlet',  outlet:'Square One Mall',            oid:'squareone',name:'Square One Manager'},
  {u:'malir',    p:'Malr@2026!',  role:'outlet',  outlet:'Mendeez Malir Cant',         oid:'malir',    name:'Malir Manager'},

// SHOPIFY SKU → IMAGE MAP
// Fetches all products from Shopify via Cloudflare Worker
// Builds: _skuImageMap = { 'SKU123': 'https://cdn.shopify.com/...' }
// ══════════════════════════════════════════════════
let _skuImageMap   = {};   // sku → image url
let _skuTitleMap   = {};   // sku → product title
let _shopifyLoaded = false;
const SHOPIFY_WORKER = 'https://mendeez-shopify.divine-mouse-0258.workers.dev';
const SHOPIFY_STORE  = 'mendeez.myshopify.com';
let _shopifyToken = '';
let _shopifyStore = 'mendeez.myshopify.com'; // fixed store name
let _barcodeImageMap = {}; // barcode → image url
let _barcodeTitleMap = {}; // barcode → product title

async function loadShopifySkuMap(){
  if(_shopifyLoaded) return;
  const token = _shopifyToken || '';
  if(!token){ console.log('No Shopify token — images will show placeholder'); return; }

  let cursor = null;
  let hasMore = true;
  let totalLoaded = 0;

  while(hasMore){
    try{
      const ep = '/products.json?limit=250&fields=title,images,variants'+(cursor?'&since_id='+cursor:'');
      const url = SHOPIFY_WORKER+'?store='+encodeURIComponent('mendeez.myshopify.com')+'&token='+encodeURIComponent(token)+'&ep='+encodeURIComponent(ep);
      const r   = await fetch(url);
      const d   = await r.json();
      const products = d.products||[];

      products.forEach(p=>{
        const imgUrl = p.images?.[0]?.src || '';
        (p.variants||[]).forEach(v=>{
          // Map by SKU
          if(v.sku){
            _skuImageMap[v.sku.trim()]         = imgUrl;
            _skuImageMap[v.sku.trim().toUpperCase()] = imgUrl;
            _skuTitleMap[v.sku.trim()]         = p.title;
          }
          // Map by barcode — this is what G-Tech returns
          if(v.barcode){
            _barcodeImageMap[v.barcode.trim()]         = imgUrl;
            _barcodeImageMap[v.barcode.trim().toUpperCase()] = imgUrl;
            _barcodeTitleMap[v.barcode.trim()]         = p.title;
          }
        });
      });

      totalLoaded += products.length;
      hasMore = products.length === 250;
      if(hasMore) cursor = products[products.length-1].id;
    }catch(e){
      console.log('Shopify load error:', e.message);
      hasMore = false;
    }
  }

  _shopifyLoaded = true;
  console.log(`Shopify loaded: ${Object.keys(_skuImageMap).length} SKUs, ${Object.keys(_barcodeImageMap).length} barcodes from ${totalLoaded} products`);
}

// Lookup by barcode first (G-Tech), fallback to SKU
function getProductImage(barcodeOrSku){
  if(!barcodeOrSku) return '';
  const k = barcodeOrSku.trim();
  return _barcodeImageMap[k] || _barcodeImageMap[k.toUpperCase()]
      || _skuImageMap[k]     || _skuImageMap[k.toUpperCase()] || '';
}

function getProductTitle(barcodeOrSku){
  if(!barcodeOrSku) return '';
  const k = barcodeOrSku.trim();
  return _barcodeTitleMap[k] || _barcodeTitleMap[k.toUpperCase()]
      || _skuTitleMap[k]     || _skuTitleMap[k.toUpperCase()] || '';
}

function getProratedTarget(oid, toDateStr){
  const toDate     = toDateStr ? new Date(toDateStr) : new Date();
  const yearMon    = toDate.toISOString().slice(0,7);
  const monthly    = TARGETS[oid+'_'+yearMon] || 0;
  if(!monthly) return {monthly:0,prorated:0,daily:0,daysUsed:0,daysTotal:0,yearMon};
  const daysTotal  = new Date(toDate.getFullYear(), toDate.getMonth()+1, 0).getDate();
  const daysUsed   = toDate.getDate();
  const daily      = monthly / daysTotal;
  const prorated   = Math.round(daily * daysUsed);
  return {monthly, prorated, daily:Math.round(daily), daysUsed, daysTotal, yearMon};
}

function fmt(n){
  if(!n||n===0)return '0';
  if(n>=1000000)return (n/1000000).toFixed(1)+'M';
  if(n>=1000)return Math.round(n/1000)+'K';
  return n.toLocaleString();
}

function setRange(btn,range,oid){

// ══ G-TECH LIVE INVENTORY ══
async function fetchGtechInventory(oid){
  const locCode = GTECH_LOC[oid] || '';
  const fromEl  = document.getElementById('invFrom_'+oid);
  const toEl    = document.getElementById('invTo_'+oid);
  const bcEl    = document.getElementById('invBarcode_'+oid);
  const statusEl= document.getElementById('invStatus_'+oid);
  const bannerEl= document.getElementById('invBanner_'+oid);
  const bodyEl  = document.getElementById('invBody_'+oid);
  const summEl  = document.getElementById('invSummary_'+oid);
  const showZero= document.getElementById('invShowZero_'+oid)?.checked ?? true;

  // Default dates: start of year → today
  const today   = new Date();
  const todayStr= today.toISOString().slice(0,10);
  if(!fromEl.value) fromEl.value = today.getFullYear() + '-01-01';
  if(!toEl.value)   toEl.value   = todayStr;

  function fmtDate(dateStr){
    const [y,m,d] = dateStr.split('-');
    return `${m}/${d}/${y} 00:00:00`;
  }

  const params = new URLSearchParams({
    API      : GTECH_API_KEY,
    DateFrom : fmtDate(fromEl.value),
    DateTo   : fmtDate(toEl.value) .replace('00:00:00','23:59:59'),
    Location : locCode,
    Barcode  : bcEl?.value.trim() || '',
  });
  const url = GTECH_BASE + '?' + params.toString();

  // UI: loading state
  if(statusEl) statusEl.textContent = '⏳ Loading…';
  if(bannerEl){ bannerEl.className='al-blue'; bannerEl.innerHTML='<span>⏳</span><span>Fetching live stock from G-Tech…</span>'; bannerEl.style.display='flex'; }
  if(bodyEl)  bodyEl.innerHTML = `<tr><td colspan="8" style="padding:24px;text-align:center;color:var(--m);font-family:var(--mono);font-size:12px">Loading inventory…</td></tr>`;
  if(summEl)  summEl.style.display='none';

  try{
    const res  = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    let rows;
    try{ rows = JSON.parse(text); } catch(e){ throw new Error('Invalid JSON response'); }
    if(!Array.isArray(rows)) rows = rows.data || rows.result || rows.records || [];

    // Normalise fields (handle any casing)
    const data = rows.map(r=>({
      barcode      : r.barcode      ?? r.Barcode      ?? '',
      location     : r.location     ?? r.Location     ?? '',
      balanceQty   : parseFloat(r.balanceQty   ?? r.BalanceQty   ?? 0),
      holdQty      : parseFloat(r.holdQty      ?? r.HoldQty      ?? 0),
      totalStock   : parseFloat(r.totalStock   ?? r.TotalStock   ?? 0),
      price        : parseFloat(r.price        ?? r.Price        ?? 0),
      discountedPrice: parseFloat(r.discountedPrice ?? r.DiscountedPrice ?? 0),
      lastUpdated  : r.lastUpdated  ?? r.LastUpdated  ?? '',
    }));

    // Filter zero stock if toggle off
    const filtered = showZero ? data : data.filter(r=>r.totalStock>0);

    // Summary stats
    const inStock  = data.filter(r=>r.totalStock>0).length;
    const zeroStock= data.filter(r=>r.totalStock===0).length;
    const totalBal = data.reduce((s,r)=>s+r.balanceQty,0);
    const totalStk = data.reduce((s,r)=>s+r.totalStock,0);

    if(summEl){
      summEl.style.display='flex';
      summEl.innerHTML=[
        {l:'Total SKUs', v:data.length,           c:'var(--bl)'},
        {l:'In Stock',   v:inStock,                c:'var(--g)'},
        {l:'Zero Stock', v:zeroStock,              c:'var(--r)'},
        {l:'Balance Qty',v:totalBal.toFixed(0),   c:'#111'},
        {l:'Total Stock',v:totalStk.toFixed(0),   c:'var(--or)'},
      ].map(s=>`<div style="background:var(--s);border:1px solid var(--b);border-radius:7px;padding:8px 14px;text-align:center;min-width:90px">
        <div style="font-size:17px;font-weight:700;font-family:var(--mono);color:${s.c}">${s.v}</div>
        <div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--m);margin-top:2px">${s.l}</div>
      </div>`).join('');
    }

    // Render rows
    if(bodyEl){
      if(filtered.length===0){
        bodyEl.innerHTML=`<tr><td colspan="8" style="padding:24px;text-align:center;color:var(--m);font-family:var(--mono);font-size:12px">No records found. Try adjusting the date range or enabling "Show zero stock".</td></tr>`;
      } else {
        bodyEl.innerHTML = filtered.map(r=>{
          const imgUrl = getProductImage(r.barcode);
          const imgHtml= imgUrl
            ? `<img src="${imgUrl}" style="width:40px;height:40px;object-fit:cover;border-radius:5px;border:1px solid var(--b)" onerror="this.style.display='none'">`
            : `<div style="width:40px;height:40px;border-radius:5px;border:1px dashed var(--b2);display:flex;align-items:center;justify-content:center;font-size:18px">📦</div>`;
          const stCls  = r.totalStock===0?'stk-out':r.balanceQty<5?'stk-low':'stk-ok';
          const stTxt  = r.totalStock===0?'Out of Stock':r.balanceQty<5?'Low Stock':'In Stock';
          const disc   = r.discountedPrice>0 ? `<span style="font-size:10px;color:var(--g)"> (${r.discountedPrice.toLocaleString()})</span>` : '';
          return `<tr>
            <td style="padding:8px 12px;border-bottom:1px solid var(--b)">${imgHtml}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--b);font-family:var(--mono);font-size:11px;color:#888">${r.barcode}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--b);font-weight:500;font-size:12px">${getProductTitle(r.barcode)||'—'}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--b);font-family:var(--mono);font-weight:700;color:${r.balanceQty>0?'var(--g)':'var(--r)'}">${r.balanceQty.toFixed(2)}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--b);font-family:var(--mono);font-weight:700;color:${r.totalStock>0?'var(--bl)':'var(--r)'}">${r.totalStock.toFixed(2)}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--b);font-family:var(--mono);color:${r.holdQty>0?'var(--or)':'var(--m2)'}">${r.holdQty.toFixed(2)}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--b);font-family:var(--mono);font-size:12px">PKR ${r.price.toLocaleString()}${disc}</td>
            <td style="padding:8px 12px;border-bottom:1px solid var(--b)"><span class="${stCls}">${stTxt}</span></td>
          </tr>`;
        }).join('');
      }
    }

    if(statusEl) statusEl.textContent = `✓ ${filtered.length} of ${data.length} rows · ${new Date().toLocaleTimeString()}`;
    if(bannerEl) bannerEl.style.display='none';

  } catch(err){
    if(statusEl) statusEl.textContent = '⚠ Error';
    if(bannerEl){
      bannerEl.style.background='var(--rd)';
      bannerEl.style.borderColor='var(--r)';
      bannerEl.style.color='var(--r)';
      bannerEl.innerHTML=`<span>⚠</span><span>${err.message}${err.message.includes('fetch')||err.message.includes('Failed')?'  — possible CORS issue. Try opening the URL directly in your browser.':''}</span>`;
    }
    if(bodyEl) bodyEl.innerHTML=`<tr><td colspan="8" style="padding:24px;text-align:center;color:var(--r);font-family:var(--mono);font-size:12px">Failed to load inventory: ${err.message}</td></tr>`;
  }
}

async function cmpApplyFilters(){
  const selOutlet = _cmpIsAsm
    ? document.getElementById('cmpOutletSel').value
    : _cmpOutletId;
  const from = document.getElementById('cmpFrom').value;
  const to   = document.getElementById('cmpTo').value;

  // ASM with nothing selected → empty state
  if(_cmpIsAsm && !selOutlet && !from && !to){ cmpShowEmpty(); return; }
  if(!selOutlet && !_cmpOutletId){ cmpShowEmpty(); return; }

  const oid = selOutlet || _cmpOutletId;

  // Update sub title
  const oname = OUTLETS.find(o=>o.id===oid)?.name||oid;
  document.getElementById('cmpSub').textContent = oname;

  // Load if needed
  await cmpLoadSheet(oid);

  // Get rows from cache
  let rows = (_cmpSheetCache[oid]?.rows||[]).map(r=>({cells:r}));
  const hdrs = _cmpSheetCache[oid]?.headers||[];

  // Filter by date
  if(from||to){
    const fd=from?new Date(from):null;
    const td=to?new Date(to+'T23:59:59'):null;
    rows=rows.filter(({cells})=>{
      for(const cell of cells){
        if(!cell)continue;
        const d=new Date(cell);
        if(!isNaN(d)&&String(cell).length>=8){
          if(fd&&d<fd)return false;
          if(td&&d>td)return false;
          return true;
        }
      }
      return true;
    });
  }

  document.getElementById('cmpFStatus').textContent =
    rows.length+' complaint'+(rows.length!==1?'s':'')+
    (from||to?' · '+( from||'...')+' → '+(to||'today'):'');

  cmpRenderAll(rows, hdrs);
}

async function cmpLoadSheet(oid, cb){
  if(_cmpLoadedIds[oid]){ if(cb)cb(); return; }
  const sid  = CMP_SHEETS[oid];
  const stab = CMP_TABS[oid]||'Complaints';
  document.getElementById('cmpStatus').textContent='Loading...';
  if(!sid){
    _cmpSheetCache[oid]={headers:[],rows:[]};
    _cmpLoadedIds[oid]=true;
    document.getElementById('cmpStatus').textContent='⚠ No sheet configured — set in Settings';
    if(cb)cb(); return;
  }
  try{
    const url=`https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(stab)}`;
    const r=await fetch(url);
    const txt=await r.text();
    const json=JSON.parse(txt.replace(/^[^(]+\(/,'').replace(/\);?$/,''));
    const cols=json.table?.cols||[];
    const rowsRaw=json.table?.rows||[];
    const headers=cols.map(c=>String(c.label||'').trim());
    const rows=rowsRaw.map(r=>(r.c||[]).map(c=>String(c?.v||c?.f||'').trim())).filter(r=>r.some(c=>c));
    _cmpSheetCache[oid]={headers,rows};
    _cmpLoadedIds[oid]=true;
    document.getElementById('cmpStatus').textContent='✓ '+rows.length+' loaded';
  }catch(e){
    _cmpSheetCache[oid]={headers:[],rows:[]};
    _cmpLoadedIds[oid]=true;
    document.getElementById('cmpStatus').textContent='✗ '+e.message.slice(0,50);
  }
  if(cb)cb();
}

function cmpShow(){
  const oid = _cmpOutletId;
  const data = _cmpSheetCache[oid];
  if(!data){ cmpShowEmpty(); return; }
  const rows = data.rows.map(r=>({cells:r}));
  cmpRenderAll(rows, data.headers);
}

function cmpShowEmpty(){
  document.getElementById('cmpEmpty').style.display='block';
  document.getElementById('cmpContent').style.display='none';
}

function cmpRenderAll(rows, hdrs){
  if(!rows.length){
    document.getElementById('cmpEmpty').style.display='block';
    document.getElementById('cmpEmpty').innerHTML='<div style="font-size:36px;margin-bottom:10px">📭</div><div style="font-weight:600;font-size:13px;color:var(--m);margin-bottom:4px">No complaints found</div><div style="font-size:11px">Try adjusting your filters</div>';
    document.getElementById('cmpContent').style.display='none';
    return;
  }
  document.getElementById('cmpEmpty').style.display='none';
  document.getElementById('cmpContent').style.display='block';

  // Status & nature index
  const statIdx=hdrs.findIndex(h=>['status','state','resolution'].some(k=>h.toLowerCase().includes(k)));
  const natIdx =hdrs.findIndex(h=>['nature','type','category'].some(k=>h.toLowerCase().includes(k)));

  // Count solved/active
  let solved=0,active=0;
  const natCounts={};
  rows.forEach(({cells})=>{
    const s=(cells[statIdx]||'').toLowerCase();
    if(statIdx>=0){
      if(s.includes('solv')||s.includes('clos')||s.includes('done'))solved++;
      else active++;
    }
    if(natIdx>=0&&cells[natIdx])natCounts[cells[natIdx]]=(natCounts[cells[natIdx]]||0)+1;
  });
  if(statIdx<0)active=rows.length;
  const total=rows.length;
  const solveRate=total>0?Math.round(solved/total*100):0;

  // ROW 1: Summary cards
  document.getElementById('cmpSummaryCards').innerHTML=[
    {lbl:'Total Complaints',val:total,      cls:'red'},
    {lbl:'Solved',           val:solved,    cls:'green'},
    {lbl:'Active / Open',    val:active,    cls:'amber'},
    {lbl:'Solve Rate',       val:solveRate+'%', cls:'blue'},
  ].map(c=>`<div class="scard">
    <div class="scard-lbl">${c.lbl}</div>
    <div class="scard-val ${c.cls}">${c.val}</div>
  </div>`).join('');

  // ROW 2: Nature breakdown
  const nats=Object.entries(natCounts).sort((a,b)=>b[1]-a[1]);
  const natColors=['var(--r)','var(--or)','var(--bl)','var(--g)','#7c3aed','#db2777'];
  const filterSel=document.getElementById('cmpNatureFilter');
  filterSel.innerHTML='<option value="">All Complaints</option>';
  nats.forEach(([n,c])=>{const o=document.createElement('option');o.value=n;o.textContent=n+' ('+c+')';filterSel.appendChild(o);});

  document.getElementById('cmpNatureGrid').innerHTML=nats.length
    ?nats.map(([n,c],i)=>`<div class="nat-card" onclick="cmpFilterNature('${n.replace(/'/g,"\\'")}')">
        <div class="nat-name" title="${n}">${n.toUpperCase()}</div>
        <div class="nat-count" style="color:${natColors[i%natColors.length]}">${c}</div>
        <div class="nat-pct">${total>0?Math.round(c/total*100)+'%':''} of total</div>
      </div>`).join('')
    :'<div style="color:var(--m2);font-size:12px;font-family:var(--mono)">No nature column detected in sheet headers</div>';

  _cmpLastRows=rows; _cmpLastHdrs=hdrs;
  cmpRenderTable();
}

function cmpFilterNature(n){
  document.getElementById('cmpNatureFilter').value=n;
  cmpRenderTable();
}

function cmpRenderTable(){
  const filter=document.getElementById('cmpNatureFilter').value;
  const hdrs=_cmpLastHdrs;
  let rows=_cmpLastRows;
  if(filter)rows=rows.filter(({cells})=>cells.some(c=>String(c).toLowerCase().includes(filter.toLowerCase())));
  document.getElementById('cmpTblCount').textContent=rows.length+' complaint'+(rows.length!==1?'s':'');
  const statIdx=hdrs.findIndex(h=>['status','state','resolution'].some(k=>h.toLowerCase().includes(k)));
  document.getElementById('cmpTHead').innerHTML=hdrs.length
    ?'<tr>'+hdrs.map(h=>`<th style="padding:8px 12px;text-align:left;font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--b);white-space:nowrap">${h}</th>`).join('')+'</tr>':'';
  if(!rows.length){
    document.getElementById('cmpTBody').innerHTML=`<tr><td colspan="${hdrs.length||5}" style="padding:20px;text-align:center;color:var(--m2);font-family:var(--mono);font-size:12px">No complaints${filter?' matching "'+filter+'"':''}</td></tr>`;
    return;
  }
  document.getElementById('cmpTBody').innerHTML=rows.map(({cells})=>{
    return '<tr onmouseover="this.style.background=\'var(--s)\'" onmouseout="this.style.background=\'\'">'+
      hdrs.map((_,ci)=>{
        const v=String(cells[ci]||'').trim();
        const lv=v.toLowerCase();
        let d=v||'—';
        if(ci===statIdx){
          if(lv.includes('solv')||lv.includes('clos'))d=`<span style="color:var(--g);font-weight:600">${v}</span>`;
          else if(lv.includes('activ')||lv.includes('open')||lv.includes('pend'))d=`<span style="color:var(--r);font-weight:600">${v}</span>`;
        }
        return `<td style="padding:7px 12px;border-bottom:1px solid var(--b);font-family:var(--mono);font-size:11px;color:#111">${d}</td>`;
      }).join('')+
    '</tr>';
  }).join('');
}

let _taskOid=null,_taskIsAsm=false;
const DEFAULT_TASKS=['Cleaning','Shelving','Stock arrangement','Window display','Staff attendance','Opening checklist','Cash counter check'];
function getTKey(oid){return 'mndz_tasks_'+oid;}
function getDKey(oid){return 'mndz_done_'+oid+'_'+new Date().toISOString().slice(0,10);}
function loadTasks(oid){try{return JSON.parse(localStorage.getItem(getTKey(oid))||'null')||DEFAULT_TASKS.slice();}catch(e){return DEFAULT_TASKS.slice();}}
function saveTasks(oid,tasks){localStorage.setItem(getTKey(oid),JSON.stringify(tasks));}
function loadDone(oid){try{return JSON.parse(localStorage.getItem(getDKey(oid))||'{}');}catch(e){return {};}}
function saveDone(oid,done){localStorage.setItem(getDKey(oid),JSON.stringify(done));}
function getTaskSummary(oid){
  const tasks=loadTasks(oid),done=loadDone(oid);
  return{completed:tasks.filter(t=>done[t]).length,total:tasks.length};
}
function updateAllTaskLabels(){
  OUTLETS.forEach(o=>{
    const{completed,total}=getTaskSummary(o.id);
    const l1=document.getElementById('taskBtnLbl_'+o.id);
    const l2=document.getElementById('asmTaskLbl_'+o.id);
    if(l1)l1.textContent=total>0?completed+'/'+total:'Daily Tasks';
    if(l2)l2.textContent=total>0?completed+'/'+total:'—';
  });
}
function openTask(oid,oname,isAsm){
  _taskOid=oid;
  _taskIsAsm=isAsm||(_user&&_user.role==='asm');
  document.getElementById('taskTitle').textContent=oname+' — Daily Tasks';
  document.getElementById('taskSubtitle').textContent=new Date().toLocaleDateString('en-PK',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('addTaskWrap').style.display=_taskIsAsm?'block':'none';
  document.getElementById('newTaskInput').value='';
  const btn=document.getElementById('addTaskBtn');
  btn.disabled=true;btn.style.opacity='.4';
  renderTaskList();
  document.getElementById('taskOverlay').style.display='flex';
  document.body.style.overflow='hidden';
}
function closeTask(){
  document.getElementById('taskOverlay').style.display='none';
  document.body.style.overflow='';
  updateAllTaskLabels();
}
function renderTaskList(){
  const tasks=loadTasks(_taskOid),done=loadDone(_taskOid);
  const completed=tasks.filter(t=>done[t]).length,total=tasks.length;
  const pct=total>0?Math.round(completed/total*100):0;
  document.getElementById('taskProgBar').style.width=pct+'%';
  document.getElementById('taskProgTxt').textContent=completed+'/'+total;
  if(!tasks.length){
    document.getElementById('taskList').innerHTML='<div style="padding:20px;text-align:center;color:#999;font-family:var(--mono);font-size:12px">No tasks yet'+(_taskIsAsm?' — add one below':'')+'</div>';
    return;
  }
  document.getElementById('taskList').innerHTML=tasks.map((task,i)=>{
    const isDone=!!done[task];
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f5f5f5;cursor:pointer" onclick="toggleTask('${task.replace(/'/g,"\\'").replace(/`/g,"\\`")}')">
      <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${isDone?'#1a9e5c':'#d0d0d0'};background:${isDone?'#1a9e5c':'#fff'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s">
        ${isDone?'<span style="color:#fff;font-size:13px;font-weight:700">✓</span>':''}
      </div>
      <span style="flex:1;font-size:13px;color:${isDone?'#999':'#111'};text-decoration:${isDone?'line-through':'none'}">${task}</span>
      ${_taskIsAsm?`<button onclick="event.stopPropagation();deleteTask(${i})" style="background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:0;line-height:1">✕</button>`:''}
    </div>`;
  }).join('');
}
function toggleTask(task){
  const done=loadDone(_taskOid);
  done[task]=!done[task];
  saveDone(_taskOid,done);
  renderTaskList();
}
function deleteTask(idx){
  if(!_taskIsAsm)return;
  const tasks=loadTasks(_taskOid);
  const task=tasks[idx];
  if(!confirm('Delete task "'+task+'"?'))return;
  tasks.splice(idx,1);
  saveTasks(_taskOid,tasks);
  const done=loadDone(_taskOid);
  delete done[task];
  saveDone(_taskOid,done);
  renderTaskList();
}
function addTask(){
  if(!_taskIsAsm)return;
  const inp=document.getElementById('newTaskInput');
  const val=inp.value.trim();
  if(!val)return;
  const tasks=loadTasks(_taskOid);
  if(tasks.includes(val)){alert('Task already exists');return;}
  tasks.push(val);
  saveTasks(_taskOid,tasks);
  inp.value='';
  const btn=document.getElementById('addTaskBtn');
  btn.disabled=true;btn.style.opacity='.4';
  renderTaskList();
}
document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('newTaskInput');
  if(inp)inp.addEventListener('input',()=>{
    const btn=document.getElementById('addTaskBtn');
    const has=!!inp.value.trim();
    btn.disabled=!has;btn.style.opacity=has?'1':'.4';
  });
});

function setRptPeriod(period,btn){
  document.querySelectorAll('.panel#panel-rpt .dbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const today=new Date(),fmt=d=>d.toISOString().slice(0,10);
  if(period==='today'){
    document.getElementById('rptFrom').value=fmt(today);
    document.getElementById('rptTo').value=fmt(today);
  }else if(period==='week'){
    const mon=new Date(today);mon.setDate(today.getDate()-today.getDay()+1);
    document.getElementById('rptFrom').value=fmt(mon);
    document.getElementById('rptTo').value=fmt(today);
  }else if(period==='month'){
    document.getElementById('rptFrom').value=fmt(new Date(today.getFullYear(),today.getMonth(),1));
    document.getElementById('rptTo').value=fmt(today);
  }
  renderReport();
}

function renderReport(){
  const oid     = document.getElementById('rptOutlet')?.value||'all';
  const fromStr = document.getElementById('rptFrom')?.value;
  const toStr   = document.getElementById('rptTo')?.value;

  // Use end date for pro-rated target (or today if not set)
  const toDate  = toStr ? new Date(toStr) : new Date();
  const outlets = oid==='all' ? OUTLETS : OUTLETS.filter(o=>o.id===oid);

  const rows = outlets.map(o=>{
    // Pro-rated target based on selected end date
    const td    = getProratedTarget(o.id, toDate.toISOString().slice(0,10));
    const tgt   = td.prorated;      // pro-rated MTD target
    const monthly = td.monthly;     // full month target
    const sale  = DEMO_SALES[o.id]||0;
    const pct   = tgt>0 ? Math.round(sale/tgt*100) : 0;
    const ts    = getTaskSummary(o.id);
    return{o, tgt, monthly, sale, pct, daysUsed:td.daysUsed, daysTotal:td.daysTotal, tasks:ts, complaints:{active:5,solved:18}};
  });
  const totSale    = rows.reduce((s,r)=>s+r.sale,0);
  const totTgt     = rows.reduce((s,r)=>s+r.tgt,0);       // total prorated MTD target
  const totMonthly = rows.reduce((s,r)=>s+r.monthly,0);   // total full month target
  const totPct     = totTgt>0 ? Math.round(totSale/totTgt*100) : 0;
  const totTasks   = rows.reduce((s,r)=>s+r.tasks.completed,0)+'/'+rows.reduce((s,r)=>s+r.tasks.total,0);
  const dateLabel  = fromStr&&toStr ? fromStr+' → '+toStr : toStr ? 'Up to '+toStr : 'MTD';
  const sc = document.getElementById('rptSummaryCards');
  if(sc)sc.innerHTML=[
    {lbl:'Total Net Sales',        val:'PKR '+totSale.toLocaleString(),    cls:'amber'},
    {lbl:'MTD Target ('+dateLabel+')', val:'PKR '+totTgt.toLocaleString(),  cls:'green'},
    {lbl:'Overall Achievement',    val:totPct+'%',                         cls:totPct>=100?'green':totPct>=70?'amber':'red'},
    {lbl:'Tasks Completed',        val:totTasks,                           cls:'blue'},
  ].map(c=>`<div class="scard"><div class="scard-lbl">${c.lbl}</div><div class="scard-val ${c.cls}">${c.val}</div></div>`).join('');
  const tb=document.getElementById('rptTableBody');
  if(tb)tb.innerHTML=rows.map(r=>{
    const pc=r.pct>=100?'var(--g)':r.pct>=70?'var(--or)':'var(--r)';
    const st=r.pct>=100?'✅ On Target':r.pct>=70?'⚡ On Track':'⚠ Behind';
    return `<tr onmouseover="this.style.background='var(--s)'" onmouseout="this.style.background=''">
      <td style="padding:10px 14px;border-bottom:1px solid var(--b);font-weight:600">${r.o.name}</td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--b);text-align:right;font-family:var(--mono)">
        PKR ${r.tgt.toLocaleString()}
        <div style="font-size:10px;color:var(--m);margin-top:2px">${r.daysUsed}/${r.daysTotal} days · PKR ${r.monthly.toLocaleString()} monthly</div>
      </td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--b);text-align:right;font-family:var(--mono);color:var(--or);font-weight:700">PKR ${r.sale.toLocaleString()}</td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--b);text-align:right">
        <span style="font-family:var(--mono);font-weight:700;color:${pc}">${r.pct}%</span>
        <div style="height:4px;background:var(--s2);border-radius:2px;margin-top:4px;width:80px;margin-left:auto">
          <div style="height:100%;background:${pc};border-radius:2px;width:${Math.min(r.pct,100)}%"></div></div>
      </td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--b);text-align:center;font-size:12px">${st}</td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--b);text-align:center;font-family:var(--mono);color:${r.tasks.completed===r.tasks.total?'var(--g)':'var(--or)'}">${r.tasks.completed}/${r.tasks.total}</td>
      <td style="padding:10px 14px;border-bottom:1px solid var(--b);text-align:center">
        <span style="color:var(--r);font-family:var(--mono);font-size:11px">🔴 ${r.complaints.active}</span>
        <span style="color:var(--g);font-family:var(--mono);font-size:11px;margin-left:6px">✓ ${r.complaints.solved}</span>
      </td>
    </tr>`;
  }).join('');
}

function generateReport(){
  const oid=document.getElementById('rptOutlet')?.value||'all';
  const from=document.getElementById('rptFrom')?.value||'—';
  const to=document.getElementById('rptTo')?.value||'—';
  const cm=new Date().toISOString().slice(0,7);
  const outlets=oid==='all'?OUTLETS:OUTLETS.filter(o=>o.id===oid);
  let totSale=0,totTgt=0;
  let rows='';
  const toDateStr2 = to!=='—' ? to : new Date().toISOString().slice(0,10);
  outlets.forEach(o=>{
    const td3=getProratedTarget(o.id, toDateStr2);
    const tgt=td3.prorated,sale=DEMO_SALES[o.id]||0;
    const pct=tgt>0?Math.round(sale/tgt*100):0;
    const{completed,total}=getTaskSummary(o.id);
    const cls=pct>=100?'color:#1a9e5c':pct>=70?'color:#d97706':'color:#cc3333';
    totSale+=sale;totTgt+=tgt;
    rows+=`<tr><td><b>${o.name}</b></td><td>${tgt.toLocaleString()}</td><td>${sale.toLocaleString()}</td>
    <td style="${cls};font-weight:700">${pct}%</td>
    <td>${pct>=100?'✅ On Target':pct>=70?'⚡ On Track':'⚠ Behind'}</td>
    <td>${completed}/${total}</td><td>5</td><td>18</td></tr>`;
  });
  const totPct=totTgt>0?Math.round(totSale/totTgt*100):0;
  const html=`<html><head><meta charset="UTF-8"><style>
    body{font-family:Arial,sans-serif;padding:30px;color:#111}
    h1{font-size:22px;margin-bottom:4px}
    .sub{font-size:12px;color:#666;margin-bottom:24px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{background:#f0f0f0;padding:9px 12px;text-align:left;border:1px solid #ddd;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
    td{padding:9px 12px;border:1px solid #ddd}
    .tot td{background:#f8f8f8;font-weight:700}
    </style></head><body>
    <h1>MENDEEZ Retail Report</h1>
    <div class="sub">Period: ${from} → ${to} &nbsp;|&nbsp; Outlet: ${oid==='all'?'All Outlets':outlets[0]?.name||''} &nbsp;|&nbsp; Generated: ${new Date().toLocaleString()}</div>
    <table><thead><tr>
      <th>Outlet</th><th>Target (PKR)</th><th>Net Sales (PKR)</th>
      <th>Achievement</th><th>Status</th><th>Tasks</th><th>Active Complaints</th><th>Solved</th>
    </tr></thead><tbody>${rows}
    <tr class="tot"><td>TOTAL / ${outlets.length} outlets</td>
    <td>${totTgt.toLocaleString()}</td><td>${totSale.toLocaleString()}</td>
    <td style="${totPct>=100?'color:#1a9e5c':totPct>=70?'color:#d97706':'color:#cc3333'}">${totPct}%</td>
    <td colspan="4"></td></tr>
    </tbody></table>


</body></html>`;
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='mendeez_report_'+from+'_to_'+to+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
