<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mendeez Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#161616;--surface2:#1f1f1f;
  --border:#2a2a2a;--border2:#333;--text:#f0ede8;--muted:#777;--muted2:#444;
  --accent:#e8c547;--accent-dim:#3a3010;
  --red:#e05252;--red-dim:#2e1212;
  --green:#4caf7d;--green-dim:#0d2719;
  --blue:#5b9cf6;--blue-dim:#0e1f3a;
  --orange:#f0974a;--orange-dim:#2e1a08;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;padding-bottom:40px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100}
.logo{font-size:17px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.logo span{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:4px;white-space:nowrap}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-amber{background:var(--accent-dim);color:var(--accent)}
.badge-red{background:var(--red-dim);color:var(--red)}
.badge-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.sdot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.upd{font-family:var(--mono);font-size:10px;color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 28px;overflow-x:auto}
.tab{padding:12px 16px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;letter-spacing:.03em}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{padding:22px 28px;max-width:1440px}
.panel{display:none}
.panel.active{display:block}
.overlay{position:fixed;inset:0;background:rgba(13,13,13,.93);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.setup-box{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:32px 40px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto}
.setup-title{font-size:19px;font-weight:700;color:var(--accent);margin-bottom:4px}
.setup-sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.setup-sec{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.setup-sec::after{content:'';flex:1;height:1px;background:var(--border)}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fi{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:8px 11px;border-radius:6px;font-family:var(--mono);font-size:12px;outline:none;transition:border-color .2s;width:100%}
.fi:focus{border-color:var(--accent)}.fi::placeholder{color:var(--muted2)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:none;padding:9px 18px;border-radius:6px;font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.btn-p{background:var(--accent);color:#000}.btn-p:hover{opacity:.85}
.btn-s{background:transparent;border:1px solid var(--border2);color:var(--text)}.btn-s:hover{background:var(--surface2)}
.btn-full{width:100%;margin-top:6px;padding:11px}
.btn-sm{padding:6px 14px;font-size:11px}
.ds{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.dt{font-size:19px;font-weight:700}.dsub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:18px}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;transition:border-color .2s}
.sc:hover{border-color:var(--border2)}
.sl{font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.sv{font-size:21px;font-weight:700;font-family:var(--mono)}
.sv.green{color:var(--green)}.sv.red{color:var(--red)}.sv.amber{color:var(--accent)}.sv.blue{color:var(--blue)}.sv.muted{color:var(--muted)}
.ssub{font-size:10px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.tc{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th{padding:8px 13px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);font-weight:500}
td{padding:9px 13px;border-bottom:1px solid var(--border);font-size:12px}
tr:last-child td{border-bottom:none}
.nodata{text-align:center;padding:24px;color:var(--muted);font-size:12px}
.stsbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:7px 28px;display:flex;gap:22px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--muted);z-index:100}
.datebar{background:var(--surface);border-bottom:1px solid var(--border);padding:9px 28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dp{padding:5px 11px;border-radius:5px;font-family:var(--mono);font-size:11px;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted);transition:all .15s}
.dp.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent);font-weight:600}
.dsep{width:1px;height:18px;background:var(--border);margin:0 4px}
.ddate{background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:5px 9px;border-radius:5px;font-family:var(--mono);font-size:11px;outline:none}
.dlbl{font-size:11px;color:var(--muted);font-family:var(--mono)}
.dapply{background:var(--accent);color:#000;border:none;padding:5px 13px;border-radius:5px;font-family:var(--sans);font-size:11px;font-weight:600;cursor:pointer}
.dactive{font-size:11px;font-family:var(--mono);color:var(--accent);margin-left:4px}
</style>
</head>

      <div class="fg"><div class="fl">Courier Tab</div><input class="fi" id="cfgCrr" value="Courier Data 26"></div>
